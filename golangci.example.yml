version: "2"

run:
  go: "1.25"
  # `wd` is not recommended but required for interoperating with Flycheck.
  relative-path-mode: wd

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      print-issued-lines: false
  sort-order:
  - severity
  - file
  - linter
  show-stats: false

formatters:
  enable:
  - gofumpt
  settings:
    gofumpt:
      extra-rules: true

linters:
  default: none
  enable:
  - asasalint
  - bodyclose
  - canonicalheader
  - containedctx
  - contextcheck
  - copyloopvar
  - cyclop
  - decorder
  - dupl
  - durationcheck
  - embeddedstructfieldcheck
  - errcheck
  # Similar to `revive.error-naming`, but includes additional suffix checking.
  - errname
  - errorlint
  - exhaustive
  - exptostd
  - fatcontext
  - funcorder
  - gocheckcompilerdirectives
  - gochecknoglobals
  - gochecknoinits
  - gochecksumtype
  - gocognit
  - goconst
  - gocritic
  - godoclint
  - godot
  - gomoddirectives
  - goprintffuncname
  - gosec
  - gosmopolitan
  - govet
  - iface
  - ineffassign
  - intrange
  - iotamixing
  - loggercheck
  - makezero
  - mirror
  - musttag
  - nakedret
  - nilerr
  - nilnesserr
  - nilnil
  - noctx
  - nolintlint
  - nosprintfhostport
  - perfsprint
  - predeclared
  - promlinter
  - protogetter
  - reassign
  - recvcheck
  - revive
  - rowserrcheck
  - sloglint
  - sqlclosecheck
  - staticcheck
  - testifylint
  - tparallel
  - unconvert
  - unused
  - usestdlibvars
  - usetesting
  settings:
    cyclop:
      max-complexity: 30
      package-average: 10
    errcheck:
      check-type-assertions: true
      disable-default-exclusions: true
      exclude-functions:
      - fmt.Print
      - fmt.Printf
      - fmt.Println
    exhaustive:
      check:
      - map
      - switch
      default-signifies-exhaustive: true
    funcorder:
      alphabetical: true
    gocognit:
      min-complexity: 20
    gocritic:
      enabled-tags:
      - diagnostic
      - style
      - performance
    godoclint:
      default: none
      enable:
      - deprecated
      - no-unused-link
    gosmopolitan:
      allow-time-local: true
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    nakedret:
      max-func-lines: 0
    nilnil:
      only-two: false
    nolintlint:
      require-explanation: true
      require-specific: true
    predeclared:
      qualified-name: true
    reassign:
      patterns:
      - ".*"
    revive:
      # https://github.com/mgechev/revive?tab=readme-ov-file#recommended-configuration
      rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: empty-block
      - name: error-naming
      - name: error-return
      - name: error-strings
      - name: errorf
      - name: exported
      - name: increment-decrement
      - name: indent-error-flow
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: redefines-builtin-id
        severity: error
      - name: superfluous-else
      - name: time-naming
      - name: unexported-return
        severity: error
      - name: unreachable-code
      - name: unused-parameter
      - name: var-declaration
      - name: var-naming
        arguments:
        - []
        - []
        - [ { skipPackageNameChecks: true } ]
    sloglint:
      no-global: all
      context: scope
    staticcheck:
      checks:
      - all
    testifylint:
      enable-all: true
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true
    usetesting:
      os-create-temp: true
      os-mkdir-temp: true
      os-setenv: true
      os-temp-dir: true
      os-chdir: true
      context-background: false
      context-todo: false

severity:
  default: error
  rules:
  - linters:
    - bodyclose
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - usestdlibvars
    severity: error
  - linters:
    - canonicalheader
    - decorder
    - dupl
    - funcorder
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - godoclint
    - godot
    - goprintffuncname
    - gosmopolitan
    - intrange
    - nakedret
    - perfsprint
    - unused
    severity: info
  - linters:
    - revive
    - gosec
    severity: "@linter"
  - linters:
    - revive
    text: "empty-block:"
    severity: info
  - linters:
    - revive
    text: "error-strings:"
    severity: info
  - linters:
    - revive
    text: "errorf:"
    severity: info
  - linters:
    - revive
    text: "increment-decrement:"
    severity: info
  - linters:
    - revive
    text: "indent-error-flow:"
    severity: info
  - linters:
    - revive
    text: "superfluous-else"
    severity: info
  - linters:
    - revive
    text: "unreachable-code:"
    severity: info
